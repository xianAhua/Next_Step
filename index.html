function cleanText(x,max){if(typeof x!=='string'||x.length>max)throw Error('文本字段不符合格式或过长');return x;}
function validate(raw){
 if(!raw||raw.schemaVersion!==1)throw Error('备份版本不兼容');
 var x=raw,p=x.profile;
 if(!p||!validDate(p.start)||!Number.isInteger(p.hours)||p.hours<1||p.hours>60)throw Error('计划设置不正确');
 cleanText(p.direction,80);cleanText(p.city,80);
 if(!Array.isArray(x.tasks)||x.tasks.length>1500||!Array.isArray(x.projects)||x.projects.length>100||!Array.isArray(x.jobs)||x.jobs.length>1000||!Array.isArray(x.reviews)||x.reviews.length>1000)throw Error('记录数量或格式不正确');
 var seen=new Set();
 function checkId(a){cleanText(a.id,100);if(!/^[a-zA-Z0-9_-]+$/.test(a.id)||seen.has(a.id))throw Error('记录编号重复或无效');seen.add(a.id);}
 var tasks=x.tasks.map(function(a){checkId(a);cleanText(a.title,300);cleanText(a.category,40);if(!Number.isInteger(a.week)||a.week<1||a.week>12||typeof a.done!=='boolean'||typeof a.custom!=='boolean'||(a.due&&!validDate(a.due)))throw Error('任务格式不正确');return {id:a.id,title:a.title,category:a.category,week:a.week,done:a.done,custom:a.custom,due:a.due||''};});
 var skills={};SKILLS.forEach(function(s){var a=x.skills&&x.skills[s[0]];if(!a||!Number.isInteger(a.level)||a.level<0||a.level>4)throw Error('技能格式不正确');skills[s[0]]={level:a.level,evidence:cleanText(a.evidence,3000)};});
 var projects=x.projects.map(function(a){checkId(a);if(!PROJECT_STATUSES.includes(a.status))throw Error('项目状态不正确');return {id:a.id,title:cleanText(a.title,120),question:cleanText(a.question,3000),evidence:cleanText(a.evidence,5000),status:a.status,url:cleanText(a.url,2000)};});
 var jobs=x.jobs.map(function(a){checkId(a);if(!STAGES.includes(a.stage)||(a.followup&&!validDate(a.followup)))throw Error('求职记录格式不正确');return {id:a.id,company:cleanText(a.company,120),role:cleanText(a.role,160),city:cleanText(a.city,80),stage:a.stage,followup:a.followup||'',url:cleanText(a.url,2000),notes:cleanText(a.notes,5000)};});
 var reviews=x.reviews.map(function(a){checkId(a);if(!validDate(a.date))throw Error('复盘日期不正确');return {id:a.id,date:a.date,title:cleanText(a.title,120),body:cleanText(a.body,10000)};});
 return {schemaVersion:1,profile:{start:p.start,hours:p.hours,direction:p.direction,city:p.city},tasks:tasks,skills:skills,projects:projects,jobs:jobs,reviews:reviews,updatedAt:typeof x.updatedAt==='string'?x.updatedAt:null};
}

function projectsPage(){
 return intro('让项目，替你说明能力。','三个初始项目是候选草案。先选一个主项目，再逐步补齐实验和文档。',action('新建项目','new-project','primary','plus'))+
 '<div class="project-grid">'+state.projects.map(function(p){var u=safeUrl(p.url);return '<article class="card project-card"><div class="project-top"><span class="project-symbol">'+icon('code')+'</span>'+pill(p.status,p.status==='已完成'?'green':p.status==='进行中'?'':'gray')+'</div><h2>'+esc(p.title)+'</h2><div><div class="label">要回答的问题</div><p>'+esc(p.question||'待明确')+'</p></div><div><div class="label">成果与证据</div><p>'+esc(p.evidence||'待添加')+'</p></div>'+(u?'<a class="small" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">打开项目链接</a>':'')+'<button class="btn" data-action="edit-project" data-id="'+p.id+'">更新项目</button></article>';}).join('')+'</div>'+(state.projects.length?'':'<div class="card empty"><strong>从一个明确的问题开始</strong>建立项目，再记录实现、结果与局限。</div>');

function jobsPage(){
 var list=state.jobs.filter(function(j){return jobFilter==='全部'||j.stage===jobFilter;});

 '<div class="job-counts"><span>岗位记录<b>'+state.jobs.length+'</b></span><span>已投递 / 面试中<b>'+state.jobs.filter(function(j){return ['已投递','面试中'].includes(j.stage);}).length+'</b></span><span>待跟进<b>'+state.jobs.filter(function(j){return j.followup&&j.followup<=today()&&!['已结束','已录用'].includes(j.stage);}).length+'</b></span></div>'+
 '<div class="toolbar"><div class="filters">'+['全部'].concat(STAGES).map(function(f){return '<button data-filter="job" data-value="'+f+'" class="'+(jobFilter===f?'active':'')+'">'+f+'</button>';}).join('')+'</div></div>'+
 '<section class="card">'+(list.length?'<div class="table-wrap"><table class="jobs-table"><thead><tr><th>公司 / 岗位</th><th>城市</th><th>阶段</th><th>跟进日期</th><th>记录</th></tr></thead><tbody>'+list.map(function(j){return '<tr><td><strong>'+esc(j.company)+'</strong><small>'+esc(j.role)+'</small></td><td>'+esc(j.city)+'</td><td><select data-job-stage="'+j.id+'" aria-label="'+esc(j.company)+'求职阶段">'+STAGES.map(function(s){return '<option '+(j.stage===s?'selected':'')+'>'+s+'</option>';}).join('')+'</select></td><td>'+esc(j.followup||'待安排')+'</td><td><button class="linkbtn" data-action="edit-job" data-id="'+j.id+'">查看 / 编辑</button></td></tr>';}).join('')+'</tbody></table></div>':'<div class="empty"><strong>'+(state.jobs.length?'这个阶段还没有岗位':'先收藏一个真正想去的岗位')+'</strong>'+(state.jobs.length?'切换阶段查看其他记录。':'没有预填或虚构的招聘信息。把公司招聘页的职位记录进来，再逐条核对要求。')+'<br>'+action('添加岗位','new-job','primary','plus')+'</div>')+'</section>'+
 '<div class="focus-panel" style="margin-top:22px"><h3>看岗位时，回答这三个问题</h3><p>我已有哪项证据？最影响匹配的缺口是什么？未来两周能补出哪份可展示成果？先收集一组真实岗位，再决定要不要扩大到机器人、移动平台等相邻方向。</p></div>';
}
function reviewsPage(){
 return intro('每周回头看，下一步更清楚。','记录做成了什么、卡在哪里，以及下周最值得投入的一件事。',action('写一篇复盘','new-review','primary','plus'))+
 (state.reviews.length?state.reviews.slice().sort(function(a,b){return b.date.localeCompare(a.date);}).map(function(r){return '<article class="card review-card"><div class="review-head"><div><h2>'+esc(r.title)+'</h2><span class="small muted">'+esc(r.date)+'</span></div><button class="linkbtn" data-action="edit-review" data-id="'+r.id+'">编辑</button></div><p>'+esc(r.body)+'</p></article>';}).join(''):'<div class="card empty"><strong>今天的思考，也是进度。</strong>用“成果 · 卡点 · 证据 · 下周行动”写下第一篇复盘。<br>'+action('开始记录','new-review','primary','note')+'</div>');
}
function searchPage(){
 var q=query.toLocaleLowerCase(),items=[];
 state.tasks.forEach(function(t){if((t.title+' '+t.category).toLocaleLowerCase().includes(q))items.push({type:'任务',title:t.title,sub:'第 '+t.week+' 周 · '+(t.done?'已完成':'未完成'),view:'roadmap'});});
 SKILLS.forEach(function(s){if((s[1]+s[2]+state.skills[s[0]].evidence).toLocaleLowerCase().includes(q))items.push({type:'技能',title:s[1],sub:LEVELS[state.skills[s[0]].level],view:'skills'});});
 state.projects.forEach(function(p){if((p.title+p.question+p.evidence).toLocaleLowerCase().includes(q))items.push({type:'项目',title:p.title,sub:p.status,view:'projects'});});
 state.jobs.forEach(function(j){if((j.company+j.role+j.city+j.notes).toLocaleLowerCase().includes(q))items.push({type:'岗位',title:j.company+' · '+j.role,sub:j.city+' · '+j.stage,view:'jobs'});});
 state.reviews.forEach(function(r){if((r.title+r.body).toLocaleLowerCase().includes(q))items.push({type:'复盘',title:r.title,sub:r.date,view:'reviews'});});
 return intro('搜索结果','“'+query+'” · 找到 '+items.length+' 条记录',action('返回页面','clear-search','',''))+
 '<div class="search-results">'+(items.length?items.slice(0,100).map(function(i){return '<button class="card search-result" data-action="search-goto" data-view="'+i.view+'">'+pill(i.type,'gray')+'<h3>'+esc(i.title)+'</h3><p>'+esc(i.sub)+'</p></button>';}).join(''):'<div class="card empty"><strong>还没找到匹配的记录</strong>试试“控制”“C++”或你记录过的公司名称。</div>')+'</div>';
}
function render(){
 document.getElementById('nav').innerHTML=NAV.map(function(n){return '<button data-action="goto" data-view="'+n[0]+'" class="'+(view===n[0]&&!query?'active':'')+'" '+(view===n[0]&&!query?'aria-current="page"':'')+'>'+icon(n[1])+n[2]+'</button>';}).join('');
 document.getElementById('currentPage').textContent=query?'搜索结果':NAV.find(function(n){return n[0]===view;})[2];
 var pages={overview:overview,roadmap:roadmap,skills:skillsPage,projects:projectsPage,jobs:jobsPage,reviews:reviewsPage};
 document.getElementById('main').innerHTML=(query?searchPage():pages[view]())+'<footer class="footnote"><span>航向 · 把下一步，变成今天能做的一步。</span><span>'+ (storageOk?'进度保存在当前浏览器 · 支持导出备份':'请导出备份保存本次进度')+'</span></footer>';
 icons();
}
function openModal(title,body){document.getElementById('dialogTitle').textContent=title;document.getElementById('dialogBody').innerHTML=body;document.getElementById('dialog').showModal();}
function field(name,label,value,type,extra){return '<label class="field"><span>'+esc(label)+'</span><input name="'+name+'" type="'+(type||'text')+'" value="'+esc(value)+'" '+(extra||'')+'></label>';}
function area(name,label,value,max){return '<label class="field"><span>'+esc(label)+'</span><textarea name="'+name+'" maxlength="'+(max||5000)+'">'+esc(value)+'</textarea></label>';}
function select(name,label,options,value){return '<label class="field"><span>'+esc(label)+'</span><select name="'+name+'">'+options.map(function(o){return '<option value="'+esc(o)+'" '+(String(o)===String(value)?'selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select></label>';}
function form(type,id,body,deletable){return '<form data-form="'+type+'" data-id="'+(id||'')+'">'+body+'<div class="dialog-actions">'+(deletable?'<button type="button" class="btn danger" data-action="confirm-delete" data-type="'+type+'" data-id="'+id+'">删除</button>':'')+'<button type="button" class="btn" data-action="close">取消</button><button type="submit" class="btn primary">保存</button></div></form>';}
function taskModal(id){var t=state.tasks.find(function(x){return x.id===id;})||{id:'',title:'',week:currentWeek(),category:'工程',due:today()};openModal(t.id?'编辑任务':'添加一个具体任务',form('task',t.id,field('title','任务名称',t.title,'text','required maxlength="300" placeholder="例如：复现 PID 跟踪实验并保存误差图"')+'<div class="field-row">'+select('week','所属周次',Array.from({length:12},function(_,i){return i+1;}),t.week)+select('category','类别',['工程','基础','控制','估计','实验','求职','复盘','作品'],t.category)+'</div>'+field('due','计划完成日期',t.due,'date','required')+'<p class="small muted" style="margin-top:12px">手动编辑后的任务会保留你指定的日期。</p>',!!t.id));}
function projectModal(id){
 var p=state.projects.find(function(x){return x.id===id;})||{id:'',title:'',status:'项目草案',question:'',evidence:'',url:''};
 openModal(p.id?'更新项目':'新建项目',form('project',p.id,field('title','项目名称',p.title,'text','required maxlength="120"')+select('status','当前状态',PROJECT_STATUSES,p.status)+area('question','要回答的问题',p.question,3000)+area('evidence','已完成成果 / 实验结果 / 局限',p.evidence,5000)+field('url','代码或文档链接（可选）',p.url,'url','maxlength="2000" placeholder="https://"'),!!p.id));
}
function jobModal(id){
 var j=state.jobs.find(function(x){return x.id===id;})||{id:'',company:'',role:'',city:'广州',stage:'待研究',followup:'',url:'',notes:''};
 openModal(j.id?'更新岗位记录':'添加岗位',form('job',j.id,field('company','公司',j.company,'text','required maxlength="120"')+field('role','岗位名称',j.role,'text','required maxlength="160"')+'<div class="field-row">'+field('city','城市',j.city,'text','required maxlength="80"')+select('stage','求职阶段',STAGES,j.stage)+'</div>'+field('followup','下次跟进日期（可选）',j.followup,'date')+field('url','职位原始链接（可选）',j.url,'url','maxlength="2000" placeholder="https://"')+area('notes','岗位要求 / 我的证据 / 下一步',j.notes,5000),!!j.id));
}
function reviewModal(id){
 var r=state.reviews.find(function(x){return x.id===id;})||{id:'',title:'第 '+currentWeek()+' 周复盘',date:today(),body:'本周成果：\n\n遇到的卡点：\n\n留下的证据：\n\n下周最重要的一步：'};
 openModal(r.id?'编辑复盘':'写一篇复盘',form('review',r.id,field('title','标题',r.title,'text','required maxlength="120"')+field('date','日期',r.date,'date','required')+area('body','复盘内容',r.body,10000),!!r.id));
}
function settingsModal(){
 var p=state.profile;
 openModal('按自己的节奏安排',form('settings','',field('direction','当前主线',p.direction,'text','required maxlength="80"')+field('city','目标城市',p.city,'text','required maxlength="80"')+'<div class="field-row">'+field('start','12 周计划起点',p.start,'date','required')+field('hours','每周投入小时数',p.hours,'number','required min="1" max="60" step="1"')+'</div><p class="small muted" style="margin-top:15px">调整起点后，模板任务的日期会同步平移，自建任务日期保持不变。小时数用于标记你的预算，任务数量需要按实际情况取舍。</p>'));
}
function exportData(){
 var data={format:'hangxiang-backup',exportedAt:new Date().toISOString(),data:state},blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});
 var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='航向备份_'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1500);toast('备份已生成，请保留下载的 JSON 文件');
}
function confirmDelete(type,id){
 openModal('删除这条记录？','<p class="muted">删除后可用之前导出的备份恢复。</p><div class="dialog-actions"><button class="btn" data-action="close">取消</button><button class="btn danger" data-action="do-delete" data-type="'+type+'" data-id="'+esc(id)+'">确认删除</button></div>');
}
document.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.dataset.filter){var f=b.dataset.filter;if(f==='task')taskFilter=b.dataset.value;if(f==='skill')skillFilter=b.dataset.value;if(f==='job')jobFilter=b.dataset.value;render();return;}
 if(b.dataset.skill){state.skills[b.dataset.skill].level=Number(b.dataset.level);save();render();return;}
 var a=b.dataset.action,id=b.dataset.id;
 if(a==='goto'){go(b.dataset.view);}
 if(a==='search-goto'){taskFilter='全部';skillFilter='全部';jobFilter='全部';go(b.dataset.view);}
 if(a==='clear-search'){query='';document.getElementById('searchInput').value='';render();}
 if(a==='close'){document.getElementById('dialog').close();pendingImport=null;}
 if(a==='new-task')taskModal();
 if(a==='edit-task')taskModal(id);
 if(a==='delete-task')confirmDelete('task',id);
 if(a==='settings')settingsModal();
 if(a==='new-project'||a==='edit-project')projectModal(id);
 if(a==='new-job'||a==='edit-job')jobModal(id);
 if(a==='new-review'||a==='edit-review')reviewModal(id);
 if(a==='skill-evidence'){var s=SKILLS.find(function(x){return x[0]===id;});openModal(s[1]+' · 能力证据',form('skill',id,area('evidence','记录代码、实验、笔记或演示链接',state.skills[id].evidence,3000)));}
 if(a==='export')exportData();
 if(a==='import')document.getElementById('importFile').click();
 if(a==='confirm-delete')confirmDelete(b.dataset.type,id);
 if(a==='do-delete'){
  var map={task:'tasks',project:'projects',job:'jobs',review:'reviews'},key=map[b.dataset.type];
  if(key){state[key]=state[key].filter(function(x){return x.id!==id;});save();render();document.getElementById('dialog').close();toast('记录已删除');}
 }
 if(a==='apply-import'&&pendingImport){state=pendingImport;pendingImport=null;save();query='';document.getElementById('searchInput').value='';render();document.getElementById('dialog').close();toast('备份已恢复');}
});
document.addEventListener('change',function(e){
 if(e.target.dataset.task){var t=state.tasks.find(function(x){return x.id===e.target.dataset.task;});if(t){t.done=e.target.checked;save();render();}}
 if(e.target.dataset.jobStage){var j=state.jobs.find(function(x){return x.id===e.target.dataset.jobStage;});if(j){j.stage=e.target.value;save();render();toast('求职阶段已更新');}}
});
document.addEventListener('submit',function(e){
 var f=e.target;if(!f.dataset.form)return;e.preventDefault();
 var d=new FormData(f),val=function(k){return String(d.get(k)||'').trim();},type=f.dataset.form,id=f.dataset.id;
 var required={task:['title'],settings:['direction','city'],project:['title'],job:['company','role','city'],review:['title']};
 if((required[type]||[]).some(function(k){return !val(k);})){toast('请填写必要内容，不能只输入空格');return;}
 if(['task','review'].includes(type)&&!validDate(val(type==='task'?'due':'date'))){toast('请选择有效日期');return;}
 if(type==='job'&&val('followup')&&!validDate(val('followup'))){toast('请选择有效的跟进日期');return;}
 var limits={task:['tasks',1500],project:['projects',100],job:['jobs',1000],review:['reviews',1000]};
 if(!id&&limits[type]&&state[limits[type][0]].length>=limits[type][1]){toast('记录数量已达到上限，请先导出并整理已有记录');return;}
 if(type==='task'){var ti=state.tasks.findIndex(function(x){return x.id===id;}),t={id:id||uid(),title:val('title'),week:Number(val('week')),category:val('category'),due:val('due'),done:ti>=0?state.tasks[ti].done:false,custom:true};if(ti>=0)state.tasks[ti]=t;else state.tasks.push(t);} 
 if(type==='settings'){
  var start=val('start');if(!validDate(start)){toast('请选择有效日期');return;}
  var delta=Math.round((Date.parse(start+'T12:00:00Z')-Date.parse(state.profile.start+'T12:00:00Z'))/86400000);
  state.tasks.forEach(function(t){if(!t.custom&&t.due)t.due=dateAdd(t.due,delta);});
  state.profile={start:start,hours:Number(val('hours')),direction:val('direction'),city:val('city')};
 }
 if(type==='skill')state.skills[id].evidence=val('evidence');
 if(['project','job'].includes(type)&&val('url')&&!safeUrl(val('url'))){toast('请输入以 https:// 或 http:// 开头的链接');return;}
 if(type==='project'){var p={id:id||uid(),title:val('title'),status:val('status'),question:val('question'),evidence:val('evidence'),url:val('url')};var pi=state.projects.findIndex(function(x){return x.id===id;});if(pi>=0)state.projects[pi]=p;else state.projects.push(p);}
 if(type==='job'){var j={id:id||uid(),company:val('company'),role:val('role'),city:val('city'),stage:val('stage'),followup:val('followup'),url:val('url'),notes:val('notes')};var ji=state.jobs.findIndex(function(x){return x.id===id;});if(ji>=0)state.jobs[ji]=j;else state.jobs.push(j);}
 if(type==='review'){var r={id:id||uid(),title:val('title'),date:val('date'),body:val('body')};var ri=state.reviews.findIndex(function(x){return x.id===id;});if(ri>=0)state.reviews[ri]=r;else state.reviews.push(r);}
 save();document.getElementById('dialog').close();render();toast(storageOk?'已保存':'已更新，请导出备份保存');
});
document.getElementById('importFile').addEventListener('change',async function(e){
 var file=e.target.files[0];e.target.value='';if(!file)return;
 if(file.size>5*1024*1024){toast('备份文件不能超过 5 MB');return;}
 try{var raw=JSON.parse(await file.text());if(raw.format!=='hangxiang-backup')throw Error('这不是航向工作台备份');pendingImport=validate(raw.data);openModal('恢复这份备份？','<p>备份包含 '+pendingImport.tasks.length+' 项任务、'+pendingImport.projects.length+' 个项目、'+pendingImport.jobs.length+' 条岗位和 '+pendingImport.reviews.length+' 篇复盘。</p><p class="muted small" style="margin-top:12px">恢复会覆盖当前页面进度。建议先取消并导出当前备份。</p><div class="dialog-actions"><button class="btn" data-action="close">取消</button><button class="btn primary" data-action="apply-import">确认恢复</button></div>');}
 catch(err){pendingImport=null;toast('无法恢复：'+err.message);}
});
document.getElementById('searchInput').addEventListener('input',function(e){clearTimeout(searchTimer);var v=e.target.value;searchTimer=setTimeout(function(){query=v.trim().slice(0,200);render();},160);});
document.getElementById('menuToggle').addEventListener('click',function(){var opened=document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('open',opened);this.setAttribute('aria-expanded',String(opened));});
document.getElementById('overlay').addEventListener('click',closeMenu);
document.getElementById('dialog').addEventListener('click',function(e){if(e.target===this)this.close();});
document.getElementById('dialog').addEventListener('close',function(){pendingImport=null;});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMenu();});
window.addEventListener('hashchange',function(){var v=location.hash.slice(1);if(NAV.some(function(n){return n[0]===v;})&&v!==view){view=v;query='';document.getElementById('searchInput').value='';render();}});
document.getElementById('topDate').textContent=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'long',day:'numeric',weekday:'long'}).format(new Date());
render();icons();
window.Hangxiang={validateBackup:validate,snapshot:function(){return JSON.parse(JSON.stringify(state));},version:1};
})();
</script>
